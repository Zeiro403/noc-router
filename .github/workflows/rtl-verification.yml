
name: RTL Verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: "Run full pseudorandom regression"
        type: boolean
        required: false
        default: false
      seeds:
        description: "Number of pseudorandom seeds"
        type: number
        required: false
        default: 20

jobs:
  verify:
    name: Lint, Unit Tests and Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make g++ python3 perl \
            autoconf flex bison \
            libfl-dev libgoogle-perftools-dev \
            zlib1g-dev

      - name: Install Verilator 5.052
        run: |
          git clone --depth 1 \
            --branch v5.052 \
            https://github.com/verilator/verilator.git \
            /tmp/verilator

          cd /tmp/verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j 2
          sudo make install

          verilator --version

      - name: RTL lint
        run: make lint-rtl

      - name: Verification lint
        run: make lint

      - name: Unit tests
        run: make unit

      - name: Standard regression
        run: make regression SUITE=standard

      - name: Full regression
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression
        run: |
          make regression SUITE=full SEEDS=${{ inputs.seeds }}

      - name: Upload simulation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: noc-verification-logs
          path: |
            results/simulation/logs/
          if-no-files-found: ignore
          retention-days: 7
