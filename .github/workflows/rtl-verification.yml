
name: RTL Verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: "Run full pseudorandom regression"
        type: boolean
        default: false
      seeds:
        description: "Number of pseudorandom seeds"
        type: number
        default: 20

jobs:
  verify:
    name: RTL Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: verilator/verilator:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          verilator --version
          python3 --version
          make --version

      - name: RTL lint
        run: make lint-rtl

      - name: Testbench lint
        run: make lint

      - name: Unit tests
        run: make unit

      - name: Standard regression
        run: make regression SUITE=standard

      - name: Full regression
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression
        run: make regression SUITE=full SEEDS=${{ inputs.seeds }}

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: noc-verification-logs
          path: results/simulation/logs/
          if-no-files-found: ignore
          retention-days: 7
